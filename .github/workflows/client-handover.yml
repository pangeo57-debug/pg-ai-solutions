name: Build and package client handover

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build and package
        run: python3 scripts/package_handover.py
      - name: Upload client handover
        uses: actions/upload-artifact@v4
        with:
          name: pg-ai-solutions-client-handover
          path: dist/pg-ai-solutions-client-handover.zip
          if-no-files-found: error
          retention-days: 30
